name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # Qdrant / bge 不在 CI 中安装：运行时应自动降级（docs/faq.md 有说明）
      - name: Lint the ontology skeleton
        run: python -m plugin.scripts.lint_bkn --error-only --bkn-root bkn
      - name: Tests
        run: python -m pytest -q
