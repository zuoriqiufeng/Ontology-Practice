# plugin/provenance.yaml
# 来源侧车（24 号 D4 / 22 号批 2-4；落层经 Q2 裁定为 Tool 层）
#
# **为什么需要**：本体的断言里有最需可查的一档——**约束**（02 号 §7：约束写错则护栏直接失效或
# 误伤，而诊断方向写错只是「思路偏了」可恢复）。此前没有任何来源记录，审计与演化都无据。
#
# **为什么不写进 .bkn**（关键）：26 号「零元信息」明令本体层不含来源/批次/演进注记；
# 且 2026-10-10 的用户裁定「BKN 零冗余」把这条从规则升级为**机检**（`_check_no_meta_info`）。
# 故来源一律落本文件（Tool 层值数据，与 constants.py / skill_manifest.yaml / field_semantics.yaml 同层）。
#
# **一致性由 lint 强制**（不变量 I5）：`bkn/risks/constraints.bkn` 的每个 constraint ID
# 必须在此有条目；缺条目 = error（见 lint_bkn.py::_check_provenance_coverage）。
#
# 依据: doc/optimize/24-ontology-build-sources.md §3 D4；22 号 §3 批 2-4；29 号 §4.3 同层先例
schema: 1
measured_at: 2026-10-10

strength_legend:
  strong: "可复现（测试断言 / 日志实录 / 代码事实）"
  medium: "厂商文档 / 现场口述——须两源交叉方可进本体"
  medium+: "单源但可复现验证（能写成测试用例）——视同强档"
  weak: "推测 / 单点——只作线索，不进本体"
  unknown: "尚无来源记录——**本批的起点**；逐批补齐，覆盖率本身就是度量"

source_types:
  S1: "产品文档（白皮书 / 手册 / 配置指南）"
  S2: "运行时日志（现场实录）"
  S3: "Skill references 反向抽取"
  S4: "测试用例与故障注入"
  S5: "现场问答与缺口（gap_log）"
  S6: "交付 / 工单记录（只存编号，正文不入库）"
  S7: "产品自身代码 / 配置 / SQL"

